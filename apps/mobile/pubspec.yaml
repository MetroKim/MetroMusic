name: breezze
description: Breezze — music discovery, streaming, library and listening platform.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  breezze_design_system:
    path: ../../packages/design_system
  breezze_audio_contracts:
    path: ../../packages/audio_contracts
  breezze_api_client:
    path: ../../packages/api_client

  # State management (spec §25: Riverpod, ADR-001)
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Audio engine (native ExoPlayer / AVFoundation wrappers)
  just_audio: ^0.9.39

  # Background audio: lock-screen controls, notification, audio focus
  audio_service: ^0.18.15

  # HTTP for backend connections
  http: ^1.2.1

  # App-private storage locations
  path_provider: ^2.1.3

  # Local database (Drift / SQLite) — favorites, recent, sync outbox
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
